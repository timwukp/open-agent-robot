[pytest]
# Offline by design: nothing under tests/ may import rclpy, boto3, torch or open a
# socket. That is what makes the suite runnable on a laptop, which is the only way
# it will actually be run (see docs/test-design.md §1).
testpaths = tests
addopts = -q --strict-markers -p no:cacheprovider
markers =
    mutation: layer L3 — applies a named mutant and requires the guard to go red.
        Two very different costs share this marker. The deploy-path mutants re-copy
        the tree and exec shell guards several times; on macOS every exec of a script
        under ~/Downloads pays a Gatekeeper assessment, which is where nearly all of
        that time goes (the guard's own greps are 30 ms). The skills/loader mutants
        text-patch one pure module and import it in-process — milliseconds. Because
        the Gatekeeper assessment is cached per binary+path the wall clock is bimodal
        and a single figure would be a lie: on 2026-08-22 (dev MacBook, python
        3.12.12 / pytest 9.0.3) 145 tests took 58-60 s, of which the 18 mutation
        tests were 60-62 s on their own and the other 127 were 21-29 s — the parts
        exceed the whole because a full run warms the cache once instead of twice.
        Read those as ranges, not budgets: nothing here asserts a duration, so a slow
        run is a slow laptop, never a failure. Those figures are ONE SUBSET (145 cases,
        18 of them mutants) measured to show the bimodality and the cache effect — they
        are not what the layer costs. The whole-layer numbers live in
        docs/test-design.md §3, re-measured per round: on 2026-08-26 (CPython 3.12.12 /
        pytest 9.0.3, 14 cores, 1-minute load average 4.03 at the end of the L1/L3 loop
        and 6.61 at the end of the whole-suite run - ONE SAMPLE each, not a range)
        the 1669-case suite was 104.9-111.0 s without the
        mutants (n=4) and the 369 mutants were 156.9-168.9 s on their own (n=4), with the
        whole suite at 264.47 s (n=1) - all three as `/usr/bin/time -p` wall clock rather
        than pytest's own summary line, a distinction this round no longer has to infer
        across rounds: the same whole-suite run reported 258.74 s on pytest's line and
        264.47 s on the wall clock, one run, two numbers, 5.7 s apart.
        That whole-suite run was rc 0 with 1668 passed and ONE SKIPPED - the
        tests/test_meta.py assertion that needs a running `oar-daemon` PROCESS, not just the
        binary. How that skip was found is itself worth the line: the measuring command was
        `python3 -m pytest -q`, and addopts above already carries a `-q`, so the loop ran at
        `-qq`, where pytest prints no `NN passed` line at all. Nine readings therefore
        carried no pass/skip breakdown and "1669 passed" was nearly written down; the real
        figures came from counting progress characters (1668 dots and one `s`). A command
        that switches off the summary line still measures the seconds and stops measuring
        what ran.
        Those nine readings were taken with 53 of the 1669 cases RED, all of them
        tests/test_doc_counts.py asserting the stale numbers that this paragraph is where
        they land: the measured tree is this one in every collected case and differs from
        it in the sentences that record the measurement. The R1.1b tree (1622 cases, 351
        mutants) read 98.6-117.7 and 150.5-165.1 s, and its whole-suite figures (252.2
        and 257.9 s) came from pytest's own summary line, so 264.47 s is NOT a comparison
        with them - two instruments, not one reading. This round ran the whole suite three
        times on three trees with the same case set (253.8 s with 53 red, 263.05 s once they
        were green, 264.47 s after the §0 reword); §3 records which is which precisely so
        they are not read as a trend, because n=8 on one tree once spanned 137 s. The 229.0-366.0 s (n=8)
        below is a reading of a tree three rounds back, 83 cases smaller, and must not be
        quoted as this one's. Every
        interval carries its n because A NARROW n=2 INTERVAL IS NOT EVIDENCE OF
        STABILITY: the first two whole-suite passes read 239.4 and 239.4 - identical to
        the tenth of a second, width 0.0 s - and six more passes of the same command on
        the same tree spanned 137 s. So an n=2 width measures the distance between two
        samples, not the command's spread, and it must be read as a LOWER BOUND (§3 says
        which three conclusions that 137 s dissolved, and why n=7 is where it stopped).
        n=4 is not safe from this either: five separate n=4 L1 spans on this machine were
        91.5-120.4, 96.1-101.7, 91.5-111.9, 98.6-117.7 and 104.9-111.0 s - the second and
        the fifth each lie entirely inside three of the others, and no two of the five
        share a minimum. Across
        rounds only a minimum that was pushed DOWN may be read as evidence, because
        adding passes can only lower an observed minimum; the L3 minimum ROSE for the
        second round running (133.8 to 150.5 to 156.9), and the explanation written here
        last round - 2.1x the load average - did not survive this one: the load was 0.51x
        (4.03 against 7.93) and the minimum rose anyway. The rule survived, the
        explanation did not, and neither reading measures the cases a round added. Which
        interpreter is part of the number, not an environment detail: every gate in this
        tree shells out to `python3`, so a homebrew relink to a Python without pytest
        reports "No module named pytest" rather than a red test.
        Per-save loop: `pytest -m "not mutation"`. Per-PR and pre-push: plain `pytest`.
    slow: takes more than a second (still offline)
filterwarnings =
    error::DeprecationWarning
