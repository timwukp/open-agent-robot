[pytest]
# Offline by design: nothing under tests/ may import rclpy, boto3, torch or open a
# socket. That is what makes the suite runnable on a laptop, which is the only way
# it will actually be run (see docs/test-design.md §1).
testpaths = tests
addopts = -q --strict-markers -p no:cacheprovider
markers =
    mutation: layer L3 — applies a named mutant and requires the guard to go red.
        Two very different costs share this marker. The deploy-path mutants re-copy
        the tree and exec shell guards several times; on macOS every exec of a script
        under ~/Downloads pays a Gatekeeper assessment, which is where nearly all of
        that time goes (the guard's own greps are 30 ms). The skills/loader mutants
        text-patch one pure module and import it in-process — milliseconds. Because
        the Gatekeeper assessment is cached per binary+path the wall clock is bimodal
        and a single figure would be a lie: on 2026-08-22 (dev MacBook, python
        3.12.12 / pytest 9.0.3) 145 tests took 58-60 s, of which the 18 mutation
        tests were 60-62 s on their own and the other 127 were 21-29 s — the parts
        exceed the whole because a full run warms the cache once instead of twice.
        Read those as ranges, not budgets: nothing here asserts a duration, so a slow
        run is a slow laptop, never a failure.
        Per-save loop: `pytest -m "not mutation"`. Per-PR and pre-push: plain `pytest`.
    slow: takes more than a second (still offline)
filterwarnings =
    error::DeprecationWarning
